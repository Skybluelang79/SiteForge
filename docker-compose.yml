name: siteforge

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-dev-secret-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: postgresql://${POSTGRES_USER:-siteforge}:${POSTGRES_PASSWORD:-siteforge}@db:5432/${POSTGRES_DB:-siteforge}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "0"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:4200}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://localhost:4200}
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}

x-backend-service: &backend-service
  build:
    context: ./backend
  environment: *backend-environment
  volumes:
    - media_data:/app/media
    - static_data:/app/staticfiles
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siteforge}
      POSTGRES_USER: ${POSTGRES_USER:-siteforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siteforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siteforge} -d ${POSTGRES_DB:-siteforge}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    <<: *backend-service
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=5)\"",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s

  worker:
    <<: *backend-service
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]

  beat:
    <<: *backend-service
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/app/beat/celerybeat-schedule"]
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - beat_data:/app/beat

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - media_data:/media:ro
      - static_data:/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "1025:1025"

  seed:
    <<: *backend-service
    profiles: ["seed"]
    command: ["python", "manage.py", "seed_dev_data", "--reset"]

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  beat_data:
