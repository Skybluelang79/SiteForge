<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">3D construction site visualization</title>
  <desc id="desc">Stylized 3D render of a construction site with a tower crane, a glass tower, and a building under construction.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="50%" stop-color="#202f4d"/>
      <stop offset="100%" stop-color="#18243b"/>
    </linearGradient>
    <linearGradient id="towerFaceA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="towerFaceB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="glassSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="slab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="slabDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="crane" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="skewY(-24) scale(1 0.92)">
      <path d="M26 0H0V26" fill="none" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="620" fill="url(#sky)"/>
  <ellipse cx="720" cy="120" rx="260" ry="180" fill="url(#glow)"/>
  <ellipse cx="240" cy="520" rx="360" ry="120" fill="#020617" opacity="0.35"/>

  <!-- Site platform -->
  <g filter="url(#softShadow)">
    <path d="M120 430 L480 560 L860 430 L500 300 Z" fill="url(#ground)"/>
    <path d="M120 430 L480 560 L860 430 L500 300 Z" fill="url(#grid)" opacity="0.55"/>
    <path d="M120 430 L480 560 L480 585 L120 455 Z" fill="#111827" opacity="0.9"/>
    <path d="M480 560 L860 430 L860 455 L480 585 Z" fill="#0b1220" opacity="0.95"/>
    <!-- Platform edge highlight -->
    <path d="M120 430 L480 560 L860 430" fill="none" stroke="#64748b" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- Building under construction (left) -->
  <g transform="translate(250,250)">
    <!-- base shadow -->
    <ellipse cx="95" cy="235" rx="110" ry="26" fill="#020617" opacity="0.35"/>
    <!-- core -->
    <path d="M20 190 L95 220 L170 190 L95 160 Z" fill="#334155"/>
    <path d="M20 190 L95 220 L95 235 L20 205 Z" fill="#1e293b"/>
    <path d="M95 220 L170 190 L170 205 L95 235 Z" fill="#0f172a"/>
    <!-- floors -->
    <g>
      <path d="M10 150 L95 184 L180 150 L95 116 Z" fill="url(#slab)"/>
      <path d="M10 150 L95 184 L95 192 L10 158 Z" fill="#334155"/>
      <path d="M95 184 L180 150 L180 158 L95 192 Z" fill="#1e293b"/>
      <path d="M14 148 L95 180 L176 148" fill="none" stroke="#94a3b8" stroke-opacity="0.25"/>
    </g>
    <g transform="translate(0,-34)">
      <path d="M10 150 L95 184 L180 150 L95 116 Z" fill="url(#slabDark)"/>
      <path d="M10 150 L95 184 L95 192 L10 158 Z" fill="#334155"/>
      <path d="M95 184 L180 150 L180 158 L95 192 Z" fill="#1e293b"/>
    </g>
    <g transform="translate(0,-68)">
      <path d="M10 150 L95 184 L180 150 L95 116 Z" fill="url(#slab)"/>
      <path d="M10 150 L95 184 L95 192 L10 158 Z" fill="#334155"/>
      <path d="M95 184 L180 150 L180 158 L95 192 Z" fill="#1e293b"/>
    </g>
    <g transform="translate(0,-102)">
      <path d="M20 150 L95 180 L170 150 L95 120 Z" fill="url(#slabDark)" opacity="0.95"/>
      <path d="M20 150 L95 180 L95 188 L20 158 Z" fill="#334155"/>
      <path d="M95 180 L170 150 L170 158 L95 188 Z" fill="#1e293b"/>
    </g>
    <!-- columns -->
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="35" y1="168" x2="35" y2="48"/>
      <line x1="75" y1="184" x2="75" y2="64"/>
      <line x1="115" y1="184" x2="115" y2="64"/>
      <line x1="155" y1="168" x2="155" y2="48"/>
    </g>
    <!-- rebar / detail -->
    <g stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2">
      <line x1="85" y1="30" x2="85" y2="5"/>
      <line x1="105" y1="30" x2="105" y2="0"/>
      <line x1="95" y1="28" x2="95" y2="-6"/>
    </g>
    <!-- safety railing -->
    <path d="M18 48 L95 18 L172 48" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Glass tower (right) -->
  <g transform="translate(520,150)" filter="url(#cardShadow)">
    <ellipse cx="95" cy="330" rx="115" ry="28" fill="#020617" opacity="0.32"/>
    <!-- right face -->
    <path d="M95 40 L170 70 L170 310 L95 340 Z" fill="url(#towerFaceB)"/>
    <!-- left face -->
    <path d="M20 70 L95 40 L95 340 L20 310 Z" fill="url(#towerFaceA)"/>
    <!-- top -->
    <path d="M20 70 L95 40 L170 70 L95 100 Z" fill="#64748b"/>
    <path d="M20 70 L95 40 L170 70 L95 100 Z" fill="url(#glass)" opacity="0.35"/>
    <!-- glass curtain left -->
    <path d="M28 78 L92 50 L92 332 L28 304 Z" fill="url(#glass)"/>
    <!-- glass curtain right -->
    <path d="M98 50 L162 78 L162 304 L98 332 Z" fill="url(#glassSide)"/>
    <!-- mullions horizontal -->
    <g stroke="#e0f2fe" stroke-opacity="0.22" stroke-width="1">
      <path d="M28 104 L92 76 M28 130 L92 102 M28 156 L92 128 M28 182 L92 154 M28 208 L92 180 M28 234 L92 206 M28 260 L92 232 M28 286 L92 258"/>
      <path d="M98 76 L162 104 M98 102 L162 130 M98 128 L162 156 M98 154 L162 182 M98 180 L162 208 M98 206 L162 234 M98 232 L162 260 M98 258 L162 286"/>
    </g>
    <!-- mullions vertical -->
    <g stroke="#e0f2fe" stroke-opacity="0.18" stroke-width="1">
      <path d="M49 69 L49 313 M70 60 L70 322"/>
      <path d="M119 60 L119 322 M141 69 L141 313"/>
    </g>
    <!-- crown -->
    <path d="M20 70 L95 40 L170 70" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
    <rect x="90" y="18" width="10" height="22" rx="2" fill="#f59e0b"/>
    <circle cx="95" cy="14" r="4" fill="#fde68a"/>
  </g>

  <!-- Tower crane -->
  <g transform="translate(430,120)">
    <!-- mast -->
    <rect x="72" y="70" width="16" height="320" fill="url(#crane)"/>
    <g stroke="#92400e" stroke-opacity="0.45" stroke-width="2">
      <line x1="72" y1="90" x2="88" y2="110"/>
      <line x1="88" y1="90" x2="72" y2="110"/>
      <line x1="72" y1="130" x2="88" y2="150"/>
      <line x1="88" y1="130" x2="72" y2="150"/>
      <line x1="72" y1="170" x2="88" y2="190"/>
      <line x1="88" y1="170" x2="72" y2="190"/>
      <line x1="72" y1="210" x2="88" y2="230"/>
      <line x1="88" y1="210" x2="72" y2="230"/>
      <line x1="72" y1="250" x2="88" y2="270"/>
      <line x1="88" y1="250" x2="72" y2="270"/>
      <line x1="72" y1="290" x2="88" y2="310"/>
      <line x1="88" y1="290" x2="72" y2="310"/>
      <line x1="72" y1="330" x2="88" y2="350"/>
      <line x1="88" y1="330" x2="72" y2="350"/>
    </g>
    <!-- cabin -->
    <rect x="58" y="48" width="44" height="26" rx="4" fill="#fbbf24"/>
    <rect x="64" y="53" width="14" height="10" rx="2" fill="#0b1220" opacity="0.7"/>
    <!-- jib -->
    <path d="M80 58 L360 40 L360 50 L80 70 Z" fill="url(#crane)"/>
    <path d="M80 58 L360 40" stroke="#fde68a" stroke-width="2" opacity="0.7"/>
    <!-- counter jib -->
    <path d="M80 58 L10 70 L10 78 L80 70 Z" fill="#d97706"/>
    <rect x="6" y="64" width="18" height="18" rx="2" fill="#475569"/>
    <!-- trolley & cable -->
    <rect x="250" y="44" width="18" height="10" rx="2" fill="#92400e"/>
    <line x1="259" y1="54" x2="259" y2="170" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- hook block -->
    <g transform="translate(259,170)">
      <rect x="-10" y="0" width="20" height="14" rx="2" fill="#334155"/>
      <path d="M0 14 C 8 14, 10 22, 6 28 C 2 34, -6 32, -6 26" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- load -->
    <g transform="translate(259,210)">
      <path d="M-26 0 L0 -10 L26 0 L0 10 Z" fill="#64748b"/>
      <path d="M-26 0 L0 10 L0 22 L-26 12 Z" fill="#475569"/>
      <path d="M0 10 L26 0 L26 12 L0 22 Z" fill="#334155"/>
      <path d="M-26 0 L0 -10 L26 0" fill="none" stroke="#94a3b8" stroke-opacity="0.4"/>
    </g>
    <!-- pendant lines -->
    <line x1="80" y1="58" x2="40" y2="20" stroke="#fcd34d" stroke-width="1.5" opacity="0.7"/>
    <line x1="80" y1="58" x2="220" y2="30" stroke="#fcd34d" stroke-width="1.5" opacity="0.7"/>
    <line x1="80" y1="58" x2="320" y2="38" stroke="#fcd34d" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Foreground elements -->
  <g>
    <!-- materials stack -->
    <g transform="translate(170,455)">
      <path d="M0 18 L30 6 L60 18 L30 30 Z" fill="#92400e"/>
      <path d="M0 18 L30 30 L30 38 L0 26 Z" fill="#78350f"/>
      <path d="M30 30 L60 18 L60 26 L30 38 Z" fill="#451a03"/>
      <path d="M4 12 L30 2 L56 12 L30 22 Z" fill="#b45309"/>
    </g>
    <!-- barrier -->
    <g transform="translate(700,420)" opacity="0.9">
      <rect x="0" y="10" width="70" height="8" rx="2" fill="#f59e0b"/>
      <rect x="0" y="22" width="70" height="8" rx="2" fill="#1e293b"/>
      <rect x="6" y="0" width="6" height="34" rx="2" fill="#64748b"/>
      <rect x="58" y="0" width="6" height="34" rx="2" fill="#64748b"/>
    </g>
    <!-- vehicle -->
    <g transform="translate(640,470)">
      <path d="M0 18 L40 4 L85 18 L45 32 Z" fill="#fbbf24"/>
      <path d="M0 18 L45 32 L45 44 L0 30 Z" fill="#d97706"/>
      <path d="M45 32 L85 18 L85 30 L45 44 Z" fill="#b45309"/>
      <path d="M8 14 L38 4 L38 14 L8 24 Z" fill="#0ea5e9" opacity="0.35"/>
      <circle cx="18" cy="36" r="6" fill="#0f172a"/>
      <circle cx="62" cy="30" r="6" fill="#0f172a"/>
    </g>
  </g>

  <!-- Ambient markers -->
  <g fill="#fbbf24">
    <circle cx="150" cy="120" r="2" opacity="0.7"/>
    <circle cx="820" cy="90" r="1.8" opacity="0.6"/>
    <circle cx="760" cy="180" r="1.5" opacity="0.5"/>
  </g>

  <!-- Caption badge -->
  <g transform="translate(36,36)" filter="url(#cardShadow)">
    <rect width="250" height="54" rx="12" fill="#0b1220" fill-opacity="0.72" stroke="#334155"/>
    <rect x="14" y="14" width="26" height="26" rx="7" fill="url(#accent)"/>
    <path d="M22 27h10M27 22v10" stroke="#0b1220" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="26" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">3D project visualization</text>
    <text x="52" y="42" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">Live coordination model · SiteForge</text>
  </g>
</svg>
