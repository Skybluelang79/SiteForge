<div class="reset-page">
  <div class="card">
    <p class="eyebrow">Password reset</p>
    <h1>Choose a new password</h1>
    @if (!token()) {
      <div class="alert">This reset link is missing a token. Request a new reset email.</div>
      <a class="primary link-btn" routerLink="/login">Back to sign in</a>
    } @else if (success()) {
      <div class="success">Your password has been reset.</div>
      <a class="primary link-btn" routerLink="/login">Sign in</a>
    } @else {
      <p class="lede">Enter a new password for your account.</p>
      <form (submit)="submit(); $event.preventDefault()">
        <label>
          <span>New password</span>
          <input
            type="password"
            autocomplete="new-password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
          />
        </label>
        <label>
          <span>Confirm password</span>
          <input
            type="password"
            autocomplete="new-password"
            [value]="confirm()"
            (input)="confirm.set($any($event.target).value)"
          />
        </label>
        @if (error()) {
          <div class="alert">{{ error() }}</div>
        }
        <button class="primary" type="submit" [disabled]="loading()">
          {{ loading() ? 'Resetting…' : 'Reset password' }}
        </button>
      </form>
      <a class="secondary" routerLink="/login">Back to sign in</a>
    }
  </div>
</div>
