app = "siteforge-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "False"
  DJANGO_TRUST_PROXY_HEADERS = "True"
  PORT = "8000"

[processes]
  app = "daphne -b 0.0.0.0 -p 8000 config.asgi:application"
  worker = "celery -A config worker -l info --concurrency=2"
  beat = "celery -A config beat -l info -s /app/beat/celerybeat-schedule"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/health/ready/"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
